services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sweet_admin
      POSTGRES_USER: sweet_admin
      POSTGRES_PASSWORD: sweet_admin
      TZ: Asia/Shanghai
    ports:
      - "${SWEET_ADMIN_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweet_admin -d sweet_admin"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:6.2.7
    ports:
      - "${SWEET_ADMIN_REDIS_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
    environment:
      TZ: Asia/Shanghai
      APP_INTEGRATION_WORKER_ENABLED: "${APP_INTEGRATION_WORKER_ENABLED:-false}"
      APP_INTEGRATION_SYNC_RUNNER_ENABLED: "${APP_INTEGRATION_SYNC_RUNNER_ENABLED:-false}"
      APP_INTEGRATION_ENDPOINT_POLICY_ALLOW_HTTP: "${APP_INTEGRATION_ENDPOINT_POLICY_ALLOW_HTTP:-false}"
      APP_INTEGRATION_ENDPOINT_POLICY_APPROVED_PRIVATE_CIDRS: "${APP_INTEGRATION_ENDPOINT_POLICY_APPROVED_PRIVATE_CIDRS:-}"
      APP_INTEGRATION_ORGANIZATION_HR_ENABLED: "${APP_INTEGRATION_ORGANIZATION_HR_ENABLED:-false}"
      APP_INTEGRATION_ORGANIZATION_HR_SOURCE_TIMEZONE: "${APP_INTEGRATION_ORGANIZATION_HR_SOURCE_TIMEZONE:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SWEET_ADMIN_BACKEND_PORT:-9009}:9009"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9009/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 45s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:9009
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SWEET_ADMIN_FRONTEND_PORT:-8008}:80"
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  backend_uploads:

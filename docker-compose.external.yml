services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-docker}
      APP_DBS_PRIMARY_HOST: ${APP_DBS_PRIMARY_HOST:-host.docker.internal}
      APP_DBS_PRIMARY_PORT: ${APP_DBS_PRIMARY_PORT:-5432}
      APP_DBS_PRIMARY_NAME: ${APP_DBS_PRIMARY_NAME:-sweet_admin}
      APP_DBS_PRIMARY_USER: ${APP_DBS_PRIMARY_USER:-sweet_admin}
      APP_DBS_PRIMARY_PASSWORD: ${APP_DBS_PRIMARY_PASSWORD:-sweet_admin}
      APP_REDIS_HOST: ${APP_REDIS_HOST:-host.docker.internal}
      APP_REDIS_PORT: ${APP_REDIS_PORT:-6379}
      APP_REDIS_DB: ${APP_REDIS_DB:-5}
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-local_external_session_secret_32_chars}
      APP_CONF_SALT: ${APP_CONF_SALT:-local_external_conf_salt_32_chars__}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      APP_RUN_MIGRATIONS: ${APP_RUN_MIGRATIONS:-false}
      APP_RUN_SEEDS: ${APP_RUN_SEEDS:-false}
      APP_REQUIRE_SECURE_CONFIG: ${APP_REQUIRE_SECURE_CONFIG:-false}
      APP_ENFORCE_CASBIN_POLICY_COVERAGE: ${APP_ENFORCE_CASBIN_POLICY_COVERAGE:-true}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:8008}
      APP_SECURITY_CORS_ALLOW_CREDENTIALS: ${APP_SECURITY_CORS_ALLOW_CREDENTIALS:-false}
      APP_AUDIT_ACCESS_LOG_RETENTION_DAYS: ${APP_AUDIT_ACCESS_LOG_RETENTION_DAYS:-0}
      APP_UPLOAD_DRIVER: ${APP_UPLOAD_DRIVER:-local}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/app/uploads}
      APP_UPLOAD_BASE_URL: ${APP_UPLOAD_BASE_URL:-/sweet_admin/files}
      APP_UPLOAD_MAX_SIZE: ${APP_UPLOAD_MAX_SIZE:-50}
      APP_UPLOAD_CHUNK_SIZE: ${APP_UPLOAD_CHUNK_SIZE:-5}
      APP_UPLOAD_ALLOWED_EXTENSIONS: ${APP_UPLOAD_ALLOWED_EXTENSIONS:-.jpg,.jpeg,.png,.gif,.webp,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx}
      APP_UPLOAD_ALLOWED_MIME_TYPES: ${APP_UPLOAD_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain,text/csv,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/zip}
      APP_UPLOAD_PUBLIC_PREVIEW: ${APP_UPLOAD_PUBLIC_PREVIEW:-false}
      APP_UPLOAD_OSS_ENDPOINT: ${APP_UPLOAD_OSS_ENDPOINT:-}
      APP_UPLOAD_OSS_ACCESS_KEY_ID: ${APP_UPLOAD_OSS_ACCESS_KEY_ID:-}
      APP_UPLOAD_OSS_ACCESS_KEY_SECRET: ${APP_UPLOAD_OSS_ACCESS_KEY_SECRET:-}
      APP_UPLOAD_OSS_BUCKET_NAME: ${APP_UPLOAD_OSS_BUCKET_NAME:-}
      APP_UPLOAD_OSS_BASE_URL: ${APP_UPLOAD_OSS_BASE_URL:-}
      APP_UPLOAD_OSS_BASE_PATH: ${APP_UPLOAD_OSS_BASE_PATH:-uploads/}
    ports:
      - "${SWEET_ADMIN_BACKEND_PORT:-9009}:9009"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9009/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:9009
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SWEET_ADMIN_FRONTEND_PORT:-8008}:80"
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  backend_uploads:

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV must be set explicitly}
      APP_DBS_PRIMARY_HOST: ${APP_DBS_PRIMARY_HOST:?APP_DBS_PRIMARY_HOST must be set}
      APP_DBS_PRIMARY_PORT: ${APP_DBS_PRIMARY_PORT:?APP_DBS_PRIMARY_PORT must be set}
      APP_DBS_PRIMARY_NAME: ${APP_DBS_PRIMARY_NAME:?APP_DBS_PRIMARY_NAME must be set}
      APP_DBS_PRIMARY_USER: ${APP_DBS_PRIMARY_USER:?APP_DBS_PRIMARY_USER must be set}
      APP_DBS_PRIMARY_PASSWORD: ${APP_DBS_PRIMARY_PASSWORD:?APP_DBS_PRIMARY_PASSWORD must be set}
      APP_DBS_PRIMARY_TLS_MODE: ${APP_DBS_PRIMARY_TLS_MODE:?APP_DBS_PRIMARY_TLS_MODE must be set}
      APP_DBS_PRIMARY_TLS_ROOT_CA_FILE: ${APP_DBS_PRIMARY_TLS_ROOT_CA_FILE?APP_DBS_PRIMARY_TLS_ROOT_CA_FILE must be declared}
      APP_DBS_PRIMARY_TLS_CERT_FILE: ${APP_DBS_PRIMARY_TLS_CERT_FILE?APP_DBS_PRIMARY_TLS_CERT_FILE must be declared}
      APP_DBS_PRIMARY_TLS_KEY_FILE: ${APP_DBS_PRIMARY_TLS_KEY_FILE?APP_DBS_PRIMARY_TLS_KEY_FILE must be declared}
      APP_REDIS_HOST: ${APP_REDIS_HOST:?APP_REDIS_HOST must be set}
      APP_REDIS_PORT: ${APP_REDIS_PORT:?APP_REDIS_PORT must be set}
      APP_REDIS_DB: ${APP_REDIS_DB:?APP_REDIS_DB must be set}
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD?APP_REDIS_PASSWORD must be declared}
      APP_REDIS_TLS_ENABLED: ${APP_REDIS_TLS_ENABLED:?APP_REDIS_TLS_ENABLED must be set}
      APP_REDIS_TLS_SERVER_NAME: ${APP_REDIS_TLS_SERVER_NAME?APP_REDIS_TLS_SERVER_NAME must be declared}
      APP_REDIS_TLS_CA_FILE: ${APP_REDIS_TLS_CA_FILE?APP_REDIS_TLS_CA_FILE must be declared}
      APP_REDIS_TLS_CERT_FILE: ${APP_REDIS_TLS_CERT_FILE?APP_REDIS_TLS_CERT_FILE must be declared}
      APP_REDIS_TLS_KEY_FILE: ${APP_REDIS_TLS_KEY_FILE?APP_REDIS_TLS_KEY_FILE must be declared}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?APP_SESSION_SECRET must be set}
      APP_CONF_SALT: ${APP_CONF_SALT:?APP_CONF_SALT must be set}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?APP_BOOTSTRAP_ADMIN_PASSWORD must be set}
      APP_BOOTSTRAP_APPLICATION_SECRET: ${APP_BOOTSTRAP_APPLICATION_SECRET:?APP_BOOTSTRAP_APPLICATION_SECRET must be set}
      APP_RUN_MIGRATIONS: ${APP_RUN_MIGRATIONS:?APP_RUN_MIGRATIONS must be set}
      APP_RUN_SEEDS: ${APP_RUN_SEEDS:?APP_RUN_SEEDS must be set}
      APP_REQUIRE_SECURE_CONFIG: ${APP_REQUIRE_SECURE_CONFIG:?APP_REQUIRE_SECURE_CONFIG must be set}
      APP_ENFORCE_CASBIN_POLICY_COVERAGE: ${APP_ENFORCE_CASBIN_POLICY_COVERAGE:?APP_ENFORCE_CASBIN_POLICY_COVERAGE must be set}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:?APP_SECURITY_CORS_ALLOWED_ORIGINS must be set}
      APP_SECURITY_CORS_ALLOW_CREDENTIALS: ${APP_SECURITY_CORS_ALLOW_CREDENTIALS:?APP_SECURITY_CORS_ALLOW_CREDENTIALS must be set}
      APP_AUDIT_ACCESS_LOG_RETENTION_DAYS: ${APP_AUDIT_ACCESS_LOG_RETENTION_DAYS:?APP_AUDIT_ACCESS_LOG_RETENTION_DAYS must be set}
      APP_UPLOAD_DRIVER: ${APP_UPLOAD_DRIVER:?APP_UPLOAD_DRIVER must be set}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:?APP_UPLOAD_DIR must be set}
      APP_UPLOAD_BASE_URL: ${APP_UPLOAD_BASE_URL:?APP_UPLOAD_BASE_URL must be set}
      APP_UPLOAD_MAX_SIZE: ${APP_UPLOAD_MAX_SIZE:?APP_UPLOAD_MAX_SIZE must be set}
      APP_UPLOAD_CHUNK_SIZE: ${APP_UPLOAD_CHUNK_SIZE:?APP_UPLOAD_CHUNK_SIZE must be set}
      APP_UPLOAD_CHUNK_TTL_HOURS: ${APP_UPLOAD_CHUNK_TTL_HOURS:?APP_UPLOAD_CHUNK_TTL_HOURS must be set}
      APP_UPLOAD_CHUNK_CLEANUP_MINUTES: ${APP_UPLOAD_CHUNK_CLEANUP_MINUTES:?APP_UPLOAD_CHUNK_CLEANUP_MINUTES must be set}
      APP_UPLOAD_ALLOWED_EXTENSIONS: ${APP_UPLOAD_ALLOWED_EXTENSIONS:?APP_UPLOAD_ALLOWED_EXTENSIONS must be set}
      APP_UPLOAD_ALLOWED_MIME_TYPES: ${APP_UPLOAD_ALLOWED_MIME_TYPES:?APP_UPLOAD_ALLOWED_MIME_TYPES must be set}
      APP_UPLOAD_PUBLIC_PREVIEW: ${APP_UPLOAD_PUBLIC_PREVIEW:?APP_UPLOAD_PUBLIC_PREVIEW must be set}
      APP_UPLOAD_OSS_ENDPOINT: ${APP_UPLOAD_OSS_ENDPOINT?APP_UPLOAD_OSS_ENDPOINT must be declared}
      APP_UPLOAD_OSS_ACCESS_KEY_ID: ${APP_UPLOAD_OSS_ACCESS_KEY_ID?APP_UPLOAD_OSS_ACCESS_KEY_ID must be declared}
      APP_UPLOAD_OSS_ACCESS_KEY_SECRET: ${APP_UPLOAD_OSS_ACCESS_KEY_SECRET?APP_UPLOAD_OSS_ACCESS_KEY_SECRET must be declared}
      APP_UPLOAD_OSS_BUCKET_NAME: ${APP_UPLOAD_OSS_BUCKET_NAME?APP_UPLOAD_OSS_BUCKET_NAME must be declared}
      APP_UPLOAD_OSS_BASE_URL: ${APP_UPLOAD_OSS_BASE_URL?APP_UPLOAD_OSS_BASE_URL must be declared}
      APP_UPLOAD_OSS_BASE_PATH: ${APP_UPLOAD_OSS_BASE_PATH?APP_UPLOAD_OSS_BASE_PATH must be declared}
    ports:
      - "${SWEET_ADMIN_BACKEND_PORT:-9009}:9009"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:9009/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 45s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:9009
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SWEET_ADMIN_FRONTEND_PORT:-8008}:80"
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  backend_uploads:
